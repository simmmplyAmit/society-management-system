<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>You're offline · Society MS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f6fa;color:#111827}
    .mark{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#6d28d9);display:flex;align-items:center;justify-content:center}
    .emoji{font-size:40px;animation:float 3.2s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    h1{margin:0;font-size:24px}
    p{margin:0;max-width:300px;font-size:14px;line-height:1.5;color:#6b7280}
    button{margin-top:6px;height:44px;padding:0 24px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
    button:active{transform:scale(.97)}
    @media (prefers-reduced-motion:reduce){.emoji{animation:none}}
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/>
      <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/>
      <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/>
    </svg>
  </div>
  <div class="emoji" aria-hidden="true">📡</div>
  <h1>You're offline</h1>
  <p>Society MS needs an internet connection to show your latest dues and notices. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
